<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Life Management Login Page</title>
  <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body>

  <div class="page">
    <section class="left">
        <div class="logo-header">
        <div class="logo">
            <img src="../Images/student_life_logo_5.png" alt="Student Life Management Logo">
        </div>
        <div class="brand">
          <strong>Student Life Management</strong>
          <span>Sign in to continue</span>
        </div>
      </div>

      <div>
        <label for="email">Email</label>
        <input id="email" placeholder="Enter email">
      </div>

      <div>
        <label for="password">Password</label>
        <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter Password"
        required
        >
      </div>

      <div class="row">
        <label><input type="checkbox"> Remember</label>
        <a href="Forgotpassword.html">Forgot password</a>
      </div>

      <button class="continue-button" type="submit">
        <a href="dashboard.html"> Continue </a>
      </button>

    </section>

    <section class="right">

    </section>
  </div>

</body>
</html>
